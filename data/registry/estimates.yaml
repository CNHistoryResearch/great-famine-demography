# Registry of published national estimates of excess deaths in the 1959-61 famine.
# Each entry is reviewed against the original where possible; `verified` says how.
# measure: excess_deaths = all deaths above a no-famine counterfactual (non-normal deaths, 非正常死亡)
# Units: millions of persons. Period is as stated by the author.
# method_class: registration | census_reconstruction | local_records | archival | hukou_accounting | model_ours
schema_version: 1
estimates:
  - id: EST-OURS-V1
    author: "This project (v1.0 model C)"
    year: 2026
    period: "mid-1958 to mid-1963"
    measure: excess_deaths
    central: 30.9
    low: 22.0
    high: 40.0
    lost_births_gross: 35.8
    lost_births_net: 28.4
    method_class: model_ours
    method: "Census-calibrated single-year two-sex cohort-component reconstruction, 1953->1964 censuses, births back-projected from 1982 census"
    verified: reproducible  # rerun models/national/famine_model.py
    sources: [models/national/results/summary.json]
  - id: EST-OFFICIAL-REG
    author: "Official registered rates (computed here)"
    year: 2026
    period: "1958-61"
    measure: excess_deaths
    central: 15.3
    low: 14.4
    high: 16.2
    method_class: registration
    method: "Registered CDR minus five alternative baselines x mid-year population"
    verified: reproducible
    note: "Floor: death registration ~60% complete over 1953-64"
  - id: EST-UN-WPP2024
    author: "UN World Population Prospects 2024 (computed here)"
    year: 2024
    period: "1958-61"
    measure: excess_deaths
    central: 15.7
    low: 12.0
    high: 18.2
    method_class: census_reconstruction
    method: "UN reconstruction; implicitly treats 1964 census as ~2.7% under-counted relative to 1953"
    verified: reproducible
    sources: ["https://github.com/PPgp/wpp2024"]
